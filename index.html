<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Circle Pixel Art</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Image to circles</p>
          <h1>Circle Art Generator</h1>
        </div>
      </header>

      <section class="panel controls">
        <label class="file-input" for="imageInput">
          <span>Choose Photo</span>
          <input id="imageInput" type="file" accept="image/*" />
        </label>

        <div class="slider-row">
          <label for="circleCount">Circles</label>
          <input id="circleCount" type="range" min="50" max="1200" step="25" value="350" />
          <span id="circleCountValue">350</span>
        </div>

        <div class="slider-row">
          <label for="minRadius">Min radius</label>
          <input id="minRadius" type="range" min="2" max="20" step="1" value="3" />
          <span id="minRadiusValue">3</span>
        </div>

        <div class="slider-row">
          <label for="maxRadius">Max radius</label>
          <input id="maxRadius" type="range" min="8" max="60" step="1" value="25" />
          <span id="maxRadiusValue">25</span>
        </div>

        <div class="slider-row">
          <label for="stepSize">Sampling</label>
          <input id="stepSize" type="range" min="4" max="18" step="1" value="8" />
          <span id="stepSizeValue">8</span>
        </div>

        <div class="button-row">
          <button id="generateBtn" class="primary">Generate</button>
          <button id="downloadBtn" class="secondary" disabled>Download SVG</button>
        </div>
      </section>

      <section class="panel preview-panel">
        <div class="preview-header">
          <span>Preview</span>
          <span id="statusBadge">Waiting for image</span>
        </div>

        <div class="canvas-wrap">
          <img id="sourcePreview" alt="Selected preview" hidden />
          <div id="svgPreview" class="svg-preview"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
